name: Azure Static Web Apps CI/CD
on:
  push:
    branches:
      - azure-deploy
jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
      - name: Get Node version
        id: get_node_version
        run: |
          node_raw_version=$(node -p "require('./package.json').engines.node")
          node_sanitized_version=$(echo $node_raw_version | sed -E 's/[^0-9.]+//g')
          echo "node_version=$node_sanitized_version" >> $GITHUB_OUTPUT
      - name: Setup Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: ${{ steps.get_node_version.outputs.node_version }}
      - name: Install dependencies
        run: yarn install
      - name: Build
        run: npm run build
        env:
          CI: false
          NEXT_TELEMETRY_DISABLED: 1
      - name: Copy config
        run: cp staticwebapp.config.json out/
      - name: Deploy to SWA
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: /out
          api_location: ''
          output_location: ''
          skip_app_build: true

